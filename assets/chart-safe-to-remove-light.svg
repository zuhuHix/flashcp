<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" width="800" height="384" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' role="img" aria-label="cp returns in under a second. The stick is done much later.">
<title>cp returns in under a second. The stick is done much later.</title>
<desc>Bar chart, seconds from the start of cp until the stick can be removed. Stick formatted the usual way (128 KB clusters): Linux kernel driver 288 s (cp returned after 0.61 s); flashcp drive mode 93.8 s (cp returned after 0.93 s). The same stick with 4 KB clusters: Linux kernel driver 50.3 s (cp returned after 0.73 s); flashcp drive mode 5.31 s (cp returned after 0.93 s).</desc>
<rect width="800" height="384" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328" text-anchor="start">cp returns in under a second. The stick is done much later.</text>
<text x="24" y="55" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">20,000 small files (169 MB) onto the Kingston USB 3 stick: seconds until it is safe to remove</text>
<rect x="24" y="73" width="10" height="10" rx="2" fill="#e5534b"/><text x="41" y="82" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Linux kernel driver</text><rect x="183.8" y="73" width="10" height="10" rx="2" fill="#0f9d8a"/><text x="200.8" y="82" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">flashcp drive mode</text><text x="176" y="323" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">0 s</text><text x="300" y="323" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">100 s</text><text x="424" y="323" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">200 s</text><text x="548" y="323" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">300 s</text><text x="24" y="130" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Stick formatted the usual way (128 KB clusters)</text><line x1="300" x2="300" y1="142" y2="202" stroke="#d8dee4" stroke-width="1"/><line x1="424" x2="424" y1="142" y2="202" stroke="#d8dee4" stroke-width="1"/><line x1="548" x2="548" y1="142" y2="202" stroke="#d8dee4" stroke-width="1"/><text x="164" y="161.5" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">Linux kernel driver</text><path d="M176,148H529.5Q533.5,148 533.5,152V162Q533.5,166 529.5,166H176Z" fill="#e5534b"/><text x="542.5" y="161.5" font-size="13" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="600" fill="#1f2328">288 s</tspan><tspan font-weight="400" fill="#59636e">  ·  cp returned after 0.61 s</tspan></text><text x="164" y="191.5" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">flashcp drive mode</text><path d="M176,178H288.3Q292.3,178 292.3,182V192Q292.3,196 288.3,196H176Z" fill="#0f9d8a"/><text x="301.3" y="191.5" font-size="13" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="600" fill="#1f2328">93.8 s</tspan><tspan font-weight="400" fill="#59636e">  ·  cp returned after 0.93 s</tspan></text><line x1="176" x2="176" y1="142" y2="202" stroke="#59636e" stroke-width="1"/><text x="24" y="228" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">The same stick with 4 KB clusters</text><line x1="300" x2="300" y1="240" y2="300" stroke="#d8dee4" stroke-width="1"/><line x1="424" x2="424" y1="240" y2="300" stroke="#d8dee4" stroke-width="1"/><line x1="548" x2="548" y1="240" y2="300" stroke="#d8dee4" stroke-width="1"/><text x="164" y="259.5" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">Linux kernel driver</text><path d="M176,246H234.4Q238.4,246 238.4,250V260Q238.4,264 234.4,264H176Z" fill="#e5534b"/><text x="247.4" y="259.5" font-size="13" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="600" fill="#1f2328">50.3 s</tspan><tspan font-weight="400" fill="#59636e">  ·  cp returned after 0.73 s</tspan></text><text x="164" y="289.5" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">flashcp drive mode</text><path d="M176,276H179.3Q182.6,276 182.6,279.3V290.7Q182.6,294 179.3,294H176Z" fill="#0f9d8a"/><text x="191.6" y="289.5" font-size="13" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="600" fill="#1f2328">5.31 s</tspan><tspan font-weight="400" fill="#59636e">  ·  cp returned after 0.93 s</tspan></text><line x1="176" x2="176" y1="240" y2="300" stroke="#59636e" stroke-width="1"/>
<text x="24" y="353" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">The rest of each bar is the unmount (kernel driver) or the eject (drive mode): the data is still going to the stick.</text>
<text x="24" y="370" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Single runs. Other kernel runs on this stick: 259–371 s (128 KB clusters) and about 72 s (4 KB clusters).</text>
</svg>
