<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 408" width="800" height="408" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' role="img" aria-label="20,000 small files onto a Kingston stick, release by release">
<title>20,000 small files onto a Kingston stick, release by release</title>
<desc>Bar chart in seconds; the solid part is the fastest run and the fainter part reaches the slowest. Without flashcp (the Linux kernel driver; 128 KB clusters, freshly formatted stick): 259–371 s. 0.1.0 · flashcp add (a command, on an unmounted stick; 128 KB clusters, stick already holding files): 90–98 s. 0.3.0 · drive mode (automatic, from any app; 128 KB clusters): 74–95 s. 0.4.0 · after “Make faster” (flashcp add onto the converted stick, 4 KB clusters; the one-time 6.35 s conversion is not in the bar): 5.48 s.</desc>
<rect width="800" height="408" fill="#0d1117"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">20,000 small files onto a Kingston stick, release by release</text>
<text x="24" y="55" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Seconds until the data is on the stick · each figure under the release its feature first shipped in</text>
<line x1="356" x2="356" y1="78" y2="330" stroke="#9198a1" stroke-width="1"/><text x="356" y="347" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">0 s</text><line x1="445" x2="445" y1="78" y2="330" stroke="#30363d" stroke-width="1"/><text x="445" y="347" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">100 s</text><line x1="534" x2="534" y1="78" y2="330" stroke="#30363d" stroke-width="1"/><text x="534" y="347" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">200 s</text><line x1="623" x2="623" y1="78" y2="330" stroke="#30363d" stroke-width="1"/><text x="623" y="347" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">300 s</text><line x1="712" x2="712" y1="78" y2="330" stroke="#30363d" stroke-width="1"/><text x="712" y="347" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">400 s</text><text x="344" y="100" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end">Without flashcp</text><text x="344" y="116" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">the Linux kernel driver</text><text x="344" y="132" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">128 KB clusters, freshly formatted stick</text><path d="M356,102H681.9Q685.9,102 685.9,106V116Q685.9,120 681.9,120H356Z" fill="#f47067" fill-opacity="0.4"/><path d="M356,102H586.3Q586.3,102 586.3,102V120Q586.3,120 586.3,120H356Z" fill="#f47067"/><text x="694.9" y="115.5" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">259–371 s</text><text x="344" y="162" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end">0.1.0 · flashcp add</text><text x="344" y="178" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">a command, on an unmounted stick</text><text x="344" y="194" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">128 KB clusters, stick already holding files</text><path d="M356,164H439.2Q443.2,164 443.2,168V178Q443.2,182 439.2,182H356Z" fill="#2dd4bf" fill-opacity="0.4"/><path d="M356,164H435.8Q435.8,164 435.8,164V182Q435.8,182 435.8,182H356Z" fill="#2dd4bf"/><text x="452.2" y="177.5" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">90–98 s</text><text x="344" y="224" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end">0.3.0 · drive mode</text><text x="344" y="240" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">automatic, from any app</text><text x="344" y="256" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">128 KB clusters</text><path d="M356,226H436.3Q440.3,226 440.3,230V240Q440.3,244 436.3,244H356Z" fill="#2dd4bf" fill-opacity="0.4"/><path d="M356,226H421.7Q421.7,226 421.7,226V244Q421.7,244 421.7,244H356Z" fill="#2dd4bf"/><text x="449.3" y="239.5" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">74–95 s</text><text x="344" y="286" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end">0.4.0 · after “Make faster”</text><text x="344" y="302" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">flashcp add onto the converted stick, 4 KB clusters</text><text x="344" y="318" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">the one-time 6.35 s conversion is not in the bar</text><path d="M356,288H358.4Q360.9,288 360.9,290.4V303.6Q360.9,306 358.4,306H356Z" fill="#2dd4bf"/><text x="369.9" y="301.5" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">5.48 s</text><line x1="356" x2="356" y1="78" y2="330" stroke="#9198a1" stroke-width="1"/>
<text x="24" y="377" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">Solid = the fastest run, fainter = up to the slowest. Not one job run four times: the rows differ in what was</text>
<text x="24" y="394" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">on the stick, and all were timed on 2026-11-10 with that day’s builds, not with each release’s binary.</text>
</svg>
