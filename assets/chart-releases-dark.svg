<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" width="800" height="348" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' role="img" aria-label="One job, release by release">
<title>One job, release by release</title>
<desc>Bar chart in seconds; the solid part is the fastest run and the fainter part reaches the slowest. Without flashcp (the Linux kernel driver): 259–371 s. 0.1.0 · flashcp add (a command, on an unmounted stick): 90–98 s. 0.3.0 · drive mode (automatic, from any app): 74–95 s. 0.4.0 · after “Make faster” (a one-time 6.35 s conversion to 4 KB clusters): 5.3–5.5 s.</desc>
<rect width="800" height="348" fill="#0d1117"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">One job, release by release</text>
<text x="24" y="55" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">20,000 small files (169 MB) onto a normally formatted Kingston USB 3 stick, until the data is on it</text>
<line x1="318" x2="318" y1="80" y2="270" stroke="#9198a1" stroke-width="1"/><text x="318" y="287" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">0 s</text><line x1="414.5" x2="414.5" y1="80" y2="270" stroke="#30363d" stroke-width="1"/><text x="414.5" y="287" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">100 s</text><line x1="511" x2="511" y1="80" y2="270" stroke="#30363d" stroke-width="1"/><text x="511" y="287" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">200 s</text><line x1="607.5" x2="607.5" y1="80" y2="270" stroke="#30363d" stroke-width="1"/><text x="607.5" y="287" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">300 s</text><line x1="704" x2="704" y1="80" y2="270" stroke="#30363d" stroke-width="1"/><text x="704" y="287" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">400 s</text><text x="306" y="104" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end">Without flashcp</text><text x="306" y="120" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">the Linux kernel driver</text><path d="M318,97H671.7Q675.7,97 675.7,101V111Q675.7,115 671.7,115H318Z" fill="#f47067" fill-opacity="0.4"/><path d="M318,97H567.7Q567.7,97 567.7,97V115Q567.7,115 567.7,115H318Z" fill="#f47067"/><text x="684.7" y="110.5" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">259–371 s</text><text x="306" y="150" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end">0.1.0 · flashcp add</text><text x="306" y="166" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">a command, on an unmounted stick</text><path d="M318,143H408.6Q412.6,143 412.6,147V157Q412.6,161 408.6,161H318Z" fill="#2dd4bf" fill-opacity="0.4"/><path d="M318,143H404.6Q404.6,143 404.6,143V161Q404.6,161 404.6,161H318Z" fill="#2dd4bf"/><text x="421.6" y="156.5" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">90–98 s</text><text x="306" y="196" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end">0.3.0 · drive mode</text><text x="306" y="212" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">automatic, from any app</text><path d="M318,189H405.4Q409.4,189 409.4,193V203Q409.4,207 405.4,207H318Z" fill="#2dd4bf" fill-opacity="0.4"/><path d="M318,189H389.2Q389.2,189 389.2,189V207Q389.2,207 389.2,207H318Z" fill="#2dd4bf"/><text x="418.4" y="202.5" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">74–95 s</text><text x="306" y="242" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="end">0.4.0 · after “Make faster”</text><text x="306" y="258" font-size="12" font-weight="400" fill="#9198a1" text-anchor="end">a one-time 6.35 s conversion to 4 KB clusters</text><path d="M318,235H320.6Q323.3,235 323.3,237.6V250.4Q323.3,253 320.6,253H318Z" fill="#2dd4bf" fill-opacity="0.4"/><path d="M318,235H323.1Q323.1,235 323.1,235V253Q323.1,253 323.1,253H318Z" fill="#2dd4bf"/><text x="332.3" y="248.5" font-size="13" font-weight="600" fill="#e6edf3" text-anchor="start">5.3–5.5 s</text><line x1="318" x2="318" y1="80" y2="270" stroke="#9198a1" stroke-width="1"/>
<text x="24" y="317" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">Solid = the fastest run, fainter = up to the slowest. All timed on 2026-11-10 with that day’s builds;</text>
<text x="24" y="334" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">the version is the release the feature first shipped in. 0.4.0: add 5.48 s after the conversion, drive mode 5.31 s on 4 KB clusters.</text>
</svg>
