<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 645" width="800" height="645" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' role="img" aria-label="How many times faster than the Linux kernel driver">
<title>How many times faster than the Linux kernel driver</title>
<desc>Dot plot on a logarithmic axis from 1 to 50 times. USB SSD · MSI DATAMAG: build a blank drive 6.7×; add to a drive with files 3.6×; pull from a kernel-filled drive 9.1×; pull from a flashcp-built drive 14.6×; drive mode, until safe to remove 1.4×. USB 3 stick · Kingston DataTraveler 3.0: build a blank stick, 4 KB clusters for both 6–27×; drive mode, 4 KB clusters for both 9–14×; drive mode, default 128 KB clusters for both 2.8–4.0×; add, default 128 KB clusters for both 5.7×; pull from a kernel-filled stick (median of 3) 1.4×; pull from a flashcp-built stick (median of 3) 6.2×. USB 2.0 stick · SanDisk Cruzer Blade: build (4 KB) vs kernel on its default 32 KB format 2.5–5.3×; add, 32 KB clusters for both 1.8–2.5×; pull from a kernel-filled stick 1.05×; pull from a flashcp-built stick 2.0×.</desc>
<rect width="800" height="645" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328" text-anchor="start">How many times faster than the Linux kernel driver</text>
<text x="24" y="55" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">20,000 small files (169 MB), the same job done both ways · a wide mark is the spread between runs</text>
<text x="352" y="94" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">1× (no gain)</text><text x="352" y="600" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">1× (no gain)</text><text x="415.8" y="94" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">2×</text><text x="415.8" y="600" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">2×</text><text x="500.1" y="94" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">5×</text><text x="500.1" y="600" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">5×</text><text x="563.9" y="94" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">10×</text><text x="563.9" y="600" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">10×</text><text x="627.7" y="94" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">20×</text><text x="627.7" y="600" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">20×</text><text x="712" y="94" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">50×</text><text x="712" y="600" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">50×</text><text x="24" y="120" font-size="13"><tspan font-weight="600" fill="#1f2328">USB SSD · MSI DATAMAG</tspan><tspan font-weight="400" fill="#59636e">   medians of 3</tspan></text><line x1="352" x2="352" y1="132" y2="257" stroke="#59636e" stroke-width="1"/><line x1="415.8" x2="415.8" y1="132" y2="257" stroke="#d8dee4" stroke-width="1"/><line x1="500.1" x2="500.1" y1="132" y2="257" stroke="#d8dee4" stroke-width="1"/><line x1="563.9" x2="563.9" y1="132" y2="257" stroke="#d8dee4" stroke-width="1"/><line x1="627.7" x2="627.7" y1="132" y2="257" stroke="#d8dee4" stroke-width="1"/><line x1="712" x2="712" y1="132" y2="257" stroke="#d8dee4" stroke-width="1"/><line x1="352" x2="712" y1="144.5" y2="144.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="149" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">build a blank drive</text><circle cx="527" cy="144.5" r="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="540" y="149" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">6.7×</text><line x1="352" x2="712" y1="169.5" y2="169.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="174" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">add to a drive with files</text><circle cx="469.9" cy="169.5" r="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="482.9" y="174" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">3.6×</text><line x1="352" x2="712" y1="194.5" y2="194.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="199" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">pull from a kernel-filled drive</text><circle cx="555.2" cy="194.5" r="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="568.2" y="199" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">9.1×</text><line x1="352" x2="712" y1="219.5" y2="219.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="224" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">pull from a flashcp-built drive</text><circle cx="598.7" cy="219.5" r="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="611.7" y="224" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">14.6×</text><line x1="352" x2="712" y1="244.5" y2="244.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="249" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">drive mode, until safe to remove</text><circle cx="383" cy="244.5" r="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="396" y="249" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">1.4×</text><text x="24" y="281" font-size="13"><tspan font-weight="600" fill="#1f2328">USB 3 stick · Kingston DataTraveler 3.0</tspan><tspan font-weight="400" fill="#59636e">   single runs unless noted</tspan></text><line x1="352" x2="352" y1="293" y2="443" stroke="#59636e" stroke-width="1"/><line x1="415.8" x2="415.8" y1="293" y2="443" stroke="#d8dee4" stroke-width="1"/><line x1="500.1" x2="500.1" y1="293" y2="443" stroke="#d8dee4" stroke-width="1"/><line x1="563.9" x2="563.9" y1="293" y2="443" stroke="#d8dee4" stroke-width="1"/><line x1="627.7" x2="627.7" y1="293" y2="443" stroke="#d8dee4" stroke-width="1"/><line x1="712" x2="712" y1="293" y2="443" stroke="#d8dee4" stroke-width="1"/><line x1="352" x2="712" y1="305.5" y2="305.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="310" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">build a blank stick, 4 KB clusters for both</text><rect x="508.8" y="300.5" width="152.2" height="10" rx="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="669" y="310" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">6–27×</text><line x1="352" x2="712" y1="330.5" y2="330.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="335" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">drive mode, 4 KB clusters for both</text><rect x="554.2" y="325.5" width="45" height="10" rx="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="607.2" y="335" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">9–14×</text><line x1="352" x2="712" y1="355.5" y2="355.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="360" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">drive mode, default 128 KB clusters for both</text><rect x="441.7" y="350.5" width="42.8" height="10" rx="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="492.6" y="360" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">2.8–4.0×</text><line x1="352" x2="712" y1="380.5" y2="380.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="385" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">add, default 128 KB clusters for both</text><circle cx="512.2" cy="380.5" r="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="525.2" y="385" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">5.7×</text><line x1="352" x2="712" y1="405.5" y2="405.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="410" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">pull from a kernel-filled stick (median of 3)</text><circle cx="383" cy="405.5" r="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="396" y="410" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">1.4×</text><line x1="352" x2="712" y1="430.5" y2="430.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="435" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">pull from a flashcp-built stick (median of 3)</text><circle cx="519.9" cy="430.5" r="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="532.9" y="435" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">6.2×</text><text x="24" y="467" font-size="13"><tspan font-weight="600" fill="#1f2328">USB 2.0 stick · SanDisk Cruzer Blade</tspan><tspan font-weight="400" fill="#59636e">   build and pull: medians of 3 · add: single runs</tspan></text><line x1="352" x2="352" y1="479" y2="579" stroke="#59636e" stroke-width="1"/><line x1="415.8" x2="415.8" y1="479" y2="579" stroke="#d8dee4" stroke-width="1"/><line x1="500.1" x2="500.1" y1="479" y2="579" stroke="#d8dee4" stroke-width="1"/><line x1="563.9" x2="563.9" y1="479" y2="579" stroke="#d8dee4" stroke-width="1"/><line x1="627.7" x2="627.7" y1="479" y2="579" stroke="#d8dee4" stroke-width="1"/><line x1="712" x2="712" y1="479" y2="579" stroke="#d8dee4" stroke-width="1"/><line x1="352" x2="712" y1="491.5" y2="491.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="496" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">build (4 KB) vs kernel on its default 32 KB format</text><rect x="431.3" y="486.5" width="79.1" height="10" rx="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="518.5" y="496" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">2.5–5.3×</text><line x1="352" x2="712" y1="516.5" y2="516.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="521" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">add, 32 KB clusters for both</text><rect x="401.1" y="511.5" width="40.2" height="10" rx="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="449.3" y="521" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">1.8–2.5×</text><line x1="352" x2="712" y1="541.5" y2="541.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="546" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">pull from a kernel-filled stick</text><circle cx="356.5" cy="541.5" r="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="369.5" y="546" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">1.05×</text><line x1="352" x2="712" y1="566.5" y2="566.5" stroke="#eaeef2" stroke-width="1"/><text x="338" y="571" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">pull from a flashcp-built stick</text><circle cx="415.8" cy="566.5" r="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="428.8" y="571" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">2.0×</text>
<text x="24" y="631" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Logarithmic axis. Each row is one job timed both ways, to the end (unmount or sync included). The benchmark tables give the seconds.</text>
</svg>
