<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" width="800" height="410" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' role="img" aria-label="The smaller the files, the bigger the gain">
<title>The smaller the files, the bigger the gain</title>
<desc>Four small bar charts sharing one scale from 0 to 30 times, one bar per dataset (mixed, small, many). build a blank drive: mixed 2.2×, small 6.7×, many 10.3×. add onto a drive holding 1.4 GB: mixed 2×, small 3.6×, many 5.1×. pull from a kernel-filled drive: mixed 3×, small 9.1×, many 11.9×. pull from a flashcp-built drive: mixed 3.2×, small 14.6×, many 26.8×.</desc>
<rect width="800" height="410" fill="#0d1117"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">The smaller the files, the bigger the gain</text>
<text x="24" y="55" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Times faster than the Linux kernel driver on the MSI USB SSD, by dataset (medians of 3)</text>
