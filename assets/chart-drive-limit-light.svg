<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 389" width="800" height="389" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif' role="img" aria-label="How close each way gets to the drive’s own speed">
<title>How close each way gets to the drive’s own speed</title>
<desc>Dot plot on a logarithmic seconds axis, three marks per drive. USB SSD (MSI DATAMAG): the drive itself 0.17 s, flashcp build 0.42 s, kernel driver 2.80 s. USB 3 stick (Kingston DataTraveler 3.0): the drive itself 2.0 s, flashcp build 2.72–9.02 s, kernel driver 52–74 s. USB 2.0 stick (SanDisk Cruzer Blade): the drive itself 26 s, flashcp build 33.6–34.6 s, kernel driver 86–180 s.</desc>
<rect width="800" height="389" fill="#ffffff"/>
<text x="24" y="34" font-size="17" font-weight="600" fill="#1f2328" text-anchor="start">How close each way gets to the drive’s own speed</text>
<text x="24" y="55" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">Writing 20,000 small files (169 MB) to a blank drive, formatting included</text>
<path d="M29,71.5L35.5,78L29,84.5L22.5,78Z" fill="#b98a0b" stroke="#ffffff" stroke-width="2"/><text x="41" y="82" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">the drive itself: 169 MB at its sequential write speed (computed)</text><circle cx="476.3" cy="78" r="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><text x="488.3" y="82" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">flashcp build</text><circle cx="598.5" cy="78" r="5" fill="#e5534b" stroke="#ffffff" stroke-width="2"/><text x="610.5" y="82" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Linux kernel driver</text><line x1="256.2" x2="256.2" y1="108" y2="294" stroke="#d8dee4" stroke-width="1"/><text x="256.2" y="311" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">0.1 s</text><line x1="396.5" x2="396.5" y1="108" y2="294" stroke="#d8dee4" stroke-width="1"/><text x="396.5" y="311" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">1 s</text><line x1="536.8" x2="536.8" y1="108" y2="294" stroke="#d8dee4" stroke-width="1"/><text x="536.8" y="311" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">10 s</text><line x1="677.1" x2="677.1" y1="108" y2="294" stroke="#d8dee4" stroke-width="1"/><text x="677.1" y="311" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">100 s</text><line x1="214" x2="744" y1="145" y2="145" stroke="#eaeef2" stroke-width="1"/><text x="24" y="142" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">USB SSD</text><text x="24" y="159" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">MSI DATAMAG</text><circle cx="459.2" cy="145" r="5" fill="#e5534b" stroke="#ffffff" stroke-width="2"/><circle cx="343.7" cy="145" r="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><path d="M288.6,138.5L295.1,145L288.6,151.5L282.1,145Z" fill="#b98a0b" stroke="#ffffff" stroke-width="2"/><text x="276.6" y="149.5" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">0.17 s</text><text x="343.7" y="132" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">0.42 s</text><text x="471.2" y="149.5" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">2.80 s</text><line x1="214" x2="744" y1="207" y2="207" stroke="#eaeef2" stroke-width="1"/><text x="24" y="204" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">USB 3 stick</text><text x="24" y="221" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Kingston DataTraveler 3.0</text><rect x="632.5" y="202" width="31.3" height="10" rx="5" fill="#e5534b" stroke="#ffffff" stroke-width="2"/><rect x="452.5" y="202" width="83" height="10" rx="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><path d="M438.7,200.5L445.2,207L438.7,213.5L432.2,207Z" fill="#b98a0b" stroke="#ffffff" stroke-width="2"/><text x="426.7" y="211.5" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">2.0 s</text><text x="494" y="194" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">2.72–9.02 s</text><text x="670.7" y="211.5" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">52–74 s</text><line x1="214" x2="744" y1="269" y2="269" stroke="#eaeef2" stroke-width="1"/><text x="24" y="266" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">USB 2.0 stick</text><text x="24" y="283" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">SanDisk Cruzer Blade</text><rect x="663.1" y="264" width="54.7" height="10" rx="5" fill="#e5534b" stroke="#ffffff" stroke-width="2"/><rect x="605.6" y="264" width="11.8" height="10" rx="5" fill="#0f9d8a" stroke="#ffffff" stroke-width="2"/><path d="M595,262.5L601.5,269L595,275.5L588.5,269Z" fill="#b98a0b" stroke="#ffffff" stroke-width="2"/><text x="583" y="273.5" font-size="13" font-weight="400" fill="#1f2328" text-anchor="end">26 s</text><text x="611.5" y="256" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">33.6–34.6 s</text><text x="724.7" y="273.5" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">86–180 s</text>
<text x="24" y="341" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Logarithmic axis. The drive itself = 169 MB ÷ its measured sequential write rate (999, 82.7 and 6.5 MB/s).</text>
<text x="24" y="358" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">flashcp build used 4 KB clusters. Kernel driver = mkfs.exfat + cp + unmount: its default format on the SSD (128 KB</text>
<text x="24" y="375" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">clusters) and the SanDisk (32 KB clusters); 4 KB clusters on the Kingston (259–371 s on its default 128 KB format).</text>
</svg>
