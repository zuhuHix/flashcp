name: Release

# Tag pushes (v*) build, smoke-test and publish a GitHub release.
# Dispatch runs, and PRs that touch this file, build and smoke-test
# everything but never publish.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml', '.github/actions/gui-deb/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run. Dispatch runs never publish a release, whatever this is set to."
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Read crate version and check tag
        id: version
        run: |
          set -eu
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="flashcp") | .version')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION (expected tag v$VERSION)"
            exit 1
          fi
          # Only commits already on main may be released.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not reachable from origin/main"
              exit 1
            fi
          fi
          echo "Crate version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The GUI carries its own version in three places; all must equal the CLI's.
      - name: Check GUI versions match
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          fail=0
          check() {
            echo "$1: $2"
            if [ "$2" != "$VERSION" ]; then
              echo "::error::$1 is $2, expected $VERSION (Cargo.toml). Bump the GUI version too, see RELEASING.md"
              fail=1
            fi
          }
          meta=$(cargo metadata --manifest-path gui/Cargo.toml --no-deps --format-version 1)
          check gui/src-tauri/tauri.conf.json "$(jq -r .version gui/src-tauri/tauri.conf.json)"
          check gui/src-tauri/Cargo.toml "$(echo "$meta" | jq -r '.packages[] | select(.name=="flashcp-gui") | .version')"
          check gui/helper/Cargo.toml "$(echo "$meta" | jq -r '.packages[] | select(.name=="flashcp-helper") | .version')"
          exit "$fail"

  build:
    name: build ${{ matrix.target }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            deb_arch: amd64
          # Native arm runner instead of qemu: the smoke tests run natively.
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      DEB_ARCH: ${{ matrix.deb_arch }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned toolchain so release builds are reproducible; bump deliberately.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11-09
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      # zig is the C cross-compiler for the zstd C code (zstdmt) on musl.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.13.0

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-zigbuild@0.24.1,cargo-deb@3.8.0

      - name: Build static binary
        run: cargo zigbuild --release --locked --target "$TARGET"

      - name: Verify static linkage
        run: |
          set -eux
          BIN="target/$TARGET/release/flashcp"
          file "$BIN"
          file "$BIN" | grep -Eq 'statically linked|static-pie linked'
          out=$(ldd "$BIN" 2>&1 || true)
          echo "$out"
          echo "$out" | grep -Eq 'not a dynamic executable|statically linked'

      # Native runner, so the binary is executed directly.
      - name: Smoke test (build an exFAT image and fsck it)
        run: |
          set -eux
          BIN="target/$TARGET/release/flashcp"
          "$BIN" --help
          sudo apt-get update
          sudo apt-get install -y exfatprogs
          mkdir -p smoke
          rm -rf smoke/src-tree
          "$BIN" gen smoke/src-tree --profile tiny
          rm -f smoke/vol.img
          truncate -s 256M smoke/vol.img
          "$BIN" build smoke/src-tree smoke/vol.img --yes-erase
          fsck.exfat -n smoke/vol.img

      - name: Package tarball and .deb
        run: |
          set -eux
          BIN="target/$TARGET/release/flashcp"
          STAGE="flashcp-$VERSION-$TARGET"
          rm -rf "$STAGE"
          mkdir -p "$STAGE" dist
          cp "$BIN" LICENSE README.md "$STAGE/"
          tar -czf "dist/$STAGE.tar.gz" "$STAGE"
          # --no-build: reuse the zigbuild output. cargo-deb maps target/release
          # to target/$TARGET/release because --target is given.
          cargo deb --no-build --no-strip --target "$TARGET" -o "dist/flashcp_${VERSION}_${DEB_ARCH}.deb"
          dpkg-deb --info "dist/flashcp_${VERSION}_${DEB_ARCH}.deb"
          dpkg-deb --contents "dist/flashcp_${VERSION}_${DEB_ARCH}.deb"

      - name: Install .deb and check it
        run: |
          set -eux
          sudo apt-get install -y "./dist/flashcp_${VERSION}_${DEB_ARCH}.deb"
          dpkg -L flashcp | grep -qx /usr/bin/flashcp
          # Not `command -v`: mtd-utils (present on some runners) ships an
          # unrelated /usr/sbin/flashcp that comes first in PATH.
          /usr/bin/flashcp --help
          sudo apt-get remove -y flashcp

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  gui-deb:
    name: build GUI .deb (amd64)
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Shared with gui.yml: pinned toolchain, Tauri CLI and content checks.
      - uses: ./.github/actions/gui-deb
        id: gui
        with:
          toolchain: 1.99.1

      - name: Stage .deb
        env:
          DEB: ${{ steps.gui.outputs.deb }}
        run: |
          set -eux
          mkdir -p dist
          cp "$DEB" "dist/flashcp-gui_${VERSION}_amd64.deb"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-gui-amd64
          path: dist/*
          if-no-files-found: error

  # Installs the GUI .deb next to the CLI .deb from this same run.
  gui-smoke:
    name: install GUI .deb with CLI .deb
    needs: [version, build, gui-deb]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-x86_64-unknown-linux-musl
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-gui-amd64
          path: dist

      - name: Check control fields
        run: |
          set -eux
          cd dist
          ls -l
          GUI="flashcp-gui_${VERSION}_amd64.deb"
          dpkg-deb -I "$GUI"
          test "$(dpkg-deb -f "$GUI" Package)" = flashcp-gui
          test "$(dpkg-deb -f "$GUI" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$GUI" Architecture)" = amd64
          dpkg-deb -f "$GUI" Depends | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -qx flashcp

      - name: Install both packages and check them
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y "./dist/flashcp_${VERSION}_amd64.deb" "./dist/flashcp-gui_${VERSION}_amd64.deb"
          # cargo-deb adds a Debian revision (0.1.0-1); compare the upstream part.
          test "$(dpkg-query -W -f '${Version}' flashcp | sed 's/-[^-]*$//')" = "$VERSION"
          test "$(dpkg-query -W -f '${Version}' flashcp-gui)" = "$VERSION"
          # A fresh install turns drive mode on for every user (the systemd user preset).
          test "$(systemctl --global is-enabled flashcp-drived.service)" = enabled
          for f in \
            /usr/bin/flashcp \
            /usr/bin/flashcp-gui \
            /usr/libexec/flashcp-helper \
            /usr/libexec/flashcp-trust \
            /usr/share/polkit-1/actions/io.github.zuhuhix.flashcp.helper.policy \
            /usr/share/polkit-1/actions/io.github.zuhuhix.flashcp.trust.policy \
            /etc/xdg/autostart/flashcp-gui.desktop; do
            test -e "$f" || { echo "::error::missing $f"; exit 1; }
          done
          # pkexec runs the helpers as root: root-owned, 0755 and never setuid/setgid.
          for bin in /usr/libexec/flashcp-helper /usr/libexec/flashcp-trust; do
            stat -c '%U:%G %a %n' "$bin"
            test "$(stat -c '%U:%G %a' "$bin")" = "root:root 755"
            test ! -u "$bin" && test ! -g "$bin"
          done
          # The policies point pkexec at the installed helpers.
          grep -qF '/usr/libexec/flashcp-helper' /usr/share/polkit-1/actions/io.github.zuhuhix.flashcp.helper.policy
          grep -qF '/usr/libexec/flashcp-trust' /usr/share/polkit-1/actions/io.github.zuhuhix.flashcp.trust.policy
          # All shared libraries of the app resolve with the package's dependencies.
          if ldd /usr/bin/flashcp-gui | grep -F 'not found'; then
            echo "::error::flashcp-gui has unresolved shared libraries"; exit 1
          fi
          /usr/bin/flashcp --help
          # The installed helper refuses to run without pkexec.
          set +e
          out="$(/usr/libexec/flashcp-helper optimize /dev/sdb1 --expect S --dry-run)"; code=$?
          set -e
          test "$code" -eq 3
          echo "$out" | grep -q "must be started via pkexec"
          sudo apt-get remove -y flashcp-gui flashcp

  # Read-only: runs for every event (tag, dispatch, PR) and produces the
  # final asset set. Nothing here can write to the repository.
  checksums:
    name: checksums
    needs: [version, build, gui-deb, gui-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -eux
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
          # The full asset set, nothing missing.
          for a in "flashcp-$V-x86_64-unknown-linux-musl.tar.gz" "flashcp-$V-aarch64-unknown-linux-musl.tar.gz" \
                   "flashcp_${V}_amd64.deb" "flashcp_${V}_arm64.deb" "flashcp-gui_${V}_amd64.deb"; do
            grep -qE "^[0-9a-f]{64}  $a\$" SHA256SUMS || { echo "::error::missing asset $a"; exit 1; }
          done
          ls -l .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

      - name: Dry run summary
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          {
            echo "Dry run: no release published"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The only job with write access, and it exists only on v* tag pushes.
  publish:
    name: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [version, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "flashcp $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            --repo "$GITHUB_REPOSITORY"
