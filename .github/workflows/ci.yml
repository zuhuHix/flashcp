name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install exfatprogs
        run: sudo apt-get update && sudo apt-get install -y exfatprogs
      - name: cargo test
        env:
          FLASHCP_REQUIRE_FSCK: "1"
        run: cargo test --locked

  fuse:
    name: drive mode (FUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install exfatprogs, fuse3, rsync
        run: sudo apt-get update && sudo apt-get install -y exfatprogs fuse3 rsync
      - name: Let the runner user open /dev/fuse
        run: sudo chmod 666 /dev/fuse
      - name: cargo test --test drive_fuse
        env:
          FLASHCP_REQUIRE_FUSE: "1"
          FLASHCP_REQUIRE_FSCK: "1"
        run: cargo test --locked --test drive_fuse -- --nocapture --test-threads=1

  image:
    name: build image, fsck, mount, diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install exfatprogs
        run: sudo apt-get update && sudo apt-get install -y exfatprogs
      - run: cargo build --release --locked
      - name: Generate source tree
        run: |
          set -eux
          ./target/release/flashcp gen src-tree --profile tiny
          mkdir -p "src-tree/ünïcødé 日本語/deep/er/and/deeper/still" src-tree/empty-dir
          echo "hello exFAT" > "src-tree/ünïcødé 日本語/deep/er/and/deeper/still/😀.txt"
          : > src-tree/empty-file
          head -c 40000000 /dev/urandom > src-tree/big.bin
      - name: Build, fsck, mount, diff (both FAT modes)
        run: |
          set -eux
          for fat in prefix full; do
            rm -f vol.img
            truncate -s 256M vol.img
            ./target/release/flashcp build src-tree vol.img --fat "$fat" --yes-erase
            fsck.exfat -n vol.img
            sudo mkdir -p /mnt/flashcp
            sudo mount -o loop,ro vol.img /mnt/flashcp
            sudo diff -r src-tree /mnt/flashcp
            sudo umount /mnt/flashcp
          done
      - name: Add onto a kernel-populated volume, fsck, mount, diff
        run: |
          set -eux
          rm -f add.img
          truncate -s 256M add.img
          mkfs.exfat add.img
          sudo mkdir -p /mnt/flashcp
          sudo mount -o loop add.img /mnt/flashcp
          sudo cp -r src-tree /mnt/flashcp/kernel-copy
          sudo umount /mnt/flashcp
          ./target/release/flashcp add src-tree add.img --to "added/by flashcp"
          ./target/release/flashcp add src-tree add.img --to kernel-copy --skip-existing
          fsck.exfat -n add.img
          ./target/release/flashcp info add.img --json
          sudo mount -o loop,ro add.img /mnt/flashcp
          sudo diff -r src-tree /mnt/flashcp/kernel-copy
          sudo diff -r src-tree "/mnt/flashcp/added/by flashcp"
          sudo umount /mnt/flashcp
      - name: Pull from the built and the kernel-populated volumes, diff
        run: |
          set -eux
          ./target/release/flashcp pull vol.img pulled-build
          diff -r src-tree pulled-build
          ./target/release/flashcp pull add.img pulled-add --from kernel-copy --json | tail -1
          diff -r src-tree pulled-add
      - name: Mount-and-diff + busy-device integration tests for build, add and pull (as root)
        env:
          # Only the test binary runs as root (it needs losetup/mount); cargo itself does not.
          # The env is passed explicitly because sudo resets it.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo env FLASHCP_MOUNT_TESTS=1 FLASHCP_REQUIRE_FSCK=1
        run: |
          set -o pipefail
          cargo test --locked --test build mount -- --nocapture 2>&1 | tee mount-tests.log
          cargo test --locked --test add_kernel mount -- --nocapture --test-threads=1 2>&1 | tee -a mount-tests.log
          cargo test --locked --test pull_kernel mount -- --nocapture --test-threads=1 2>&1 | tee -a mount-tests.log
          cargo test --locked --test sync_kernel mount -- --nocapture --test-threads=1 2>&1 | tee -a mount-tests.log
          if grep -q SKIP mount-tests.log; then echo "::error::a gated mount test was skipped"; exit 1; fi
