name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install exfatprogs
        run: sudo apt-get update && sudo apt-get install -y exfatprogs
      - name: cargo test
        env:
          FLASHCP_REQUIRE_FSCK: "1"
        run: cargo test --locked
      - name: Drive daemon against the real flashcp mount over FUSE
        run: |
          set -eux
          sudo apt-get install -y fuse3
          if ./target/debug/flashcp mount --help >/dev/null 2>&1; then
            FLASHCP_DRIVE_TESTS_REAL=1 cargo test --locked --test daemon_drived -- --test-threads=1
          else
            echo "::warning::flashcp mount is not in this build yet (drive core PR); ran the stand-in driver only"
          fi

  fuse:
    name: drive mode (FUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install exfatprogs, fuse3, rsync
        run: sudo apt-get update && sudo apt-get install -y exfatprogs fuse3 rsync
      - name: Let the runner user open /dev/fuse
        run: sudo chmod 666 /dev/fuse
      - name: cargo test --test drive_fuse
        env:
          FLASHCP_REQUIRE_FUSE: "1"
          FLASHCP_REQUIRE_FSCK: "1"
        run: cargo test --locked --test drive_fuse -- --nocapture --test-threads=1

  image:
    name: build image, fsck, mount, diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install exfatprogs
        run: sudo apt-get update && sudo apt-get install -y exfatprogs
      - run: cargo build --release --locked
      - name: Generate source tree
        run: |
          set -eux
          ./target/release/flashcp gen src-tree --profile tiny
          mkdir -p "src-tree/ünïcødé 日本語/deep/er/and/deeper/still" src-tree/empty-dir
          echo "hello exFAT" > "src-tree/ünïcødé 日本語/deep/er/and/deeper/still/😀.txt"
          : > src-tree/empty-file
          head -c 40000000 /dev/urandom > src-tree/big.bin
      - name: Build, fsck, mount, diff (both FAT modes)
        run: |
          set -eux
          for fat in prefix full; do
            rm -f vol.img
            truncate -s 256M vol.img
            ./target/release/flashcp build src-tree vol.img --fat "$fat" --yes-erase
            fsck.exfat -n vol.img
            sudo mkdir -p /mnt/flashcp
            sudo mount -o loop,ro vol.img /mnt/flashcp
            sudo diff -r src-tree /mnt/flashcp
            sudo umount /mnt/flashcp
          done
      - name: Add onto a kernel-populated volume, fsck, mount, diff
        run: |
          set -eux
          rm -f add.img
          truncate -s 256M add.img
          mkfs.exfat add.img
          sudo mkdir -p /mnt/flashcp
          sudo mount -o loop add.img /mnt/flashcp
          sudo cp -r src-tree /mnt/flashcp/kernel-copy
          sudo umount /mnt/flashcp
          ./target/release/flashcp add src-tree add.img --to "added/by flashcp"
          ./target/release/flashcp add src-tree add.img --to kernel-copy --skip-existing
          fsck.exfat -n add.img
          ./target/release/flashcp info add.img --json
          sudo mount -o loop,ro add.img /mnt/flashcp
          sudo diff -r src-tree /mnt/flashcp/kernel-copy
          sudo diff -r src-tree "/mnt/flashcp/added/by flashcp"
          sudo umount /mnt/flashcp
      - name: Recluster a kernel-populated 128 KB volume in place; the kernel must read, write and accept it
        run: |
          set -eux
          F=./target/release/flashcp
          rm -f recl.img recl.before
          truncate -s 2G recl.img
          mkfs.exfat -c 128K recl.img
          sudo mkdir -p /mnt/flashcp
          sudo mount -o loop recl.img /mnt/flashcp
          sudo cp -r src-tree /mnt/flashcp/kernel-copy
          sudo umount /mnt/flashcp
          # --check says yes (exit 0); --dry-run must not touch the image
          $F recluster --check recl.img
          cp --sparse=always recl.img recl.before
          $F recluster --dry-run recl.img
          cmp recl.img recl.before
          rm -f recl.before
          # the real run: file data lay where the bigger FAT has to go, so it moves first (2 switches)
          $F recluster recl.img --json | tee recl.log
          grep -q '"switches":2' recl.log
          grep -q '"event":"done".*"changed":true' recl.log
          fsck.exfat -n recl.img
          $F info recl.img --json | tee recl-info.json
          grep -q '"cluster":4096' recl-info.json
          sudo mount -o loop,ro recl.img /mnt/flashcp
          sudo diff -r src-tree /mnt/flashcp/kernel-copy
          sudo umount /mnt/flashcp
          # the kernel writes to it: add a copy, remove a directory, check again
          sudo mount -o loop recl.img /mnt/flashcp
          sudo cp -r src-tree /mnt/flashcp/after
          sudo rm -r "/mnt/flashcp/kernel-copy/ünïcødé 日本語"
          sudo umount /mnt/flashcp
          fsck.exfat -n recl.img
          sudo mount -o loop,ro recl.img /mnt/flashcp
          sudo diff -r src-tree /mnt/flashcp/after
          sudo umount /mnt/flashcp
          # flashcp itself accepts the result
          $F add src-tree recl.img --to "added after"
          fsck.exfat -n recl.img
          sudo mount -o loop,ro recl.img /mnt/flashcp
          sudo diff -r src-tree "/mnt/flashcp/added after"
          sudo diff -r src-tree /mnt/flashcp/after
          sudo umount /mnt/flashcp
          rm -f recl.img recl.log recl-info.json
      - name: Recluster a fragmented 32 KB volume (FAT chains) with --fat full
        run: |
          set -eux
          F=./target/release/flashcp
          rm -f frag.img
          truncate -s 1G frag.img
          mkfs.exfat -c 32K frag.img
          sudo mkdir -p /mnt/flashcp
          sudo mount -o loop frag.img /mnt/flashcp
          # the volume filled with 8-cluster files, every other one deleted, the tree copied into the holes
          sudo bash scripts/xos/recluster_images.sh fragfill /mnt/flashcp src-tree 32768
          sudo umount /mnt/flashcp
          fsck.exfat -n frag.img
          sudo mount -o loop,ro frag.img /mnt/flashcp
          sudo diff -r src-tree /mnt/flashcp
          sudo umount /mnt/flashcp
          $F recluster --check frag.img
          $F recluster frag.img --fat full --json | tee frag.log
          grep -q '"event":"done".*"changed":true' frag.log
          grep -q '"fragmented":[1-9]' frag.log
          fsck.exfat -n frag.img
          $F info frag.img --json | grep -q '"cluster":4096'
          sudo mount -o loop,ro frag.img /mnt/flashcp
          sudo diff -r src-tree /mnt/flashcp
          sudo umount /mnt/flashcp
          rm -f frag.img frag.log
      - name: Recluster a volume that holds a file over 4 GiB
        run: |
          set -eux
          F=./target/release/flashcp
          rm -f huge.img
          truncate -s 6G huge.img
          mkfs.exfat -c 128K huge.img
          sudo mkdir -p /mnt/flashcp
          sudo mount -o loop huge.img /mnt/flashcp
          sudo cp -r src-tree /mnt/flashcp/tree
          # real data at the start, across the 4 GiB mark and at the end; the kernel fills the gaps
          for seek in 0 4095 4299; do
            sudo dd if=/dev/urandom of=/mnt/flashcp/huge.bin bs=1M count=1 seek="$seek" conv=notrunc
          done
          sudo ls -l /mnt/flashcp/huge.bin
          before=$(sudo sha256sum /mnt/flashcp/huge.bin | cut -d' ' -f1)
          sudo umount /mnt/flashcp
          $F recluster --check huge.img
          $F recluster huge.img --json | tee huge.log
          grep -q '"event":"done".*"changed":true' huge.log
          fsck.exfat -n huge.img
          sudo mount -o loop,ro huge.img /mnt/flashcp
          after=$(sudo sha256sum /mnt/flashcp/huge.bin | cut -d' ' -f1)
          [ "$before" = "$after" ]
          sudo diff -r src-tree /mnt/flashcp/tree
          sudo umount /mnt/flashcp
          rm -f huge.img huge.log
      - name: Pull from the built and the kernel-populated volumes, diff
        run: |
          set -eux
          ./target/release/flashcp pull vol.img pulled-build
          diff -r src-tree pulled-build
          ./target/release/flashcp pull add.img pulled-add --from kernel-copy --json | tail -1
          diff -r src-tree pulled-add
      - name: Mount-and-diff + busy-device integration tests for build, add and pull (as root)
        env:
          # Only the test binary runs as root (it needs losetup/mount); cargo itself does not.
          # The env is passed explicitly because sudo resets it.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo env FLASHCP_MOUNT_TESTS=1 FLASHCP_REQUIRE_FSCK=1
        run: |
          set -o pipefail
          cargo test --locked --test build mount -- --nocapture 2>&1 | tee mount-tests.log
          cargo test --locked --test add_kernel mount -- --nocapture --test-threads=1 2>&1 | tee -a mount-tests.log
          cargo test --locked --test pull_kernel mount -- --nocapture --test-threads=1 2>&1 | tee -a mount-tests.log
          cargo test --locked --test sync_kernel mount -- --nocapture --test-threads=1 2>&1 | tee -a mount-tests.log
          if grep -q SKIP mount-tests.log; then echo "::error::a gated mount test was skipped"; exit 1; fi
