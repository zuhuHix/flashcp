name: GUI

on:
  push:
    branches: [main]
    paths:
      - "gui/**"
      - "packaging/desktop/**"
      - ".github/workflows/gui.yml"
  pull_request:
    branches: [main]
    paths:
      - "gui/**"
      - "packaging/desktop/**"
      - ".github/workflows/gui.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  test:
    name: fmt, clippy, tests, packaging checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config desktop-file-utils libxml2-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: cargo fmt
        working-directory: gui
        run: cargo fmt --all --check
      - name: cargo clippy
        working-directory: gui
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        working-directory: gui
        run: cargo test --locked
      - name: UI tests
        working-directory: gui
        run: node --test "ui/tests/*.test.mjs"
      - name: Helper argv smoke test (unprivileged, no device is opened)
        working-directory: gui
        run: |
          set -eu
          cargo build --locked -p flashcp-helper --bin flashcp-helper
          helper=target/debug/flashcp-helper
          # expect <exit code> <text in the JSON error line> <argv...>
          expect() {
            want="$1"; text="$2"; shift 2
            set +e; out="$("$helper" "$@")"; code=$?; set -e
            echo "flashcp-helper $* -> $code $out"
            test "$code" -eq "$want" || { echo "::error::exit $code, expected $want: $*"; exit 1; }
            case "$out" in *"$text"*) ;; *) echo "::error::missing \"$text\": $*"; exit 1 ;; esac
          }
          # Well-formed optimize requests parse, then stop at the root check.
          expect 3 "must be started via pkexec" optimize /dev/sdb1 --expect SER1
          expect 3 "must be started via pkexec" optimize /dev/sdb1 --expect SER1 --dry-run
          # The temp dir and the dangerous flags can never come from the caller.
          for extra in "--temp /tmp" "--temp-volatile-i-accept-data-loss" "--force" "--yes" "--json" \
                       "--target-fd 5" "/home/u"; do
            # shellcheck disable=SC2086
            expect 3 "unexpected argument for optimize" optimize /dev/sdb1 --expect SER1 $extra
          done
          expect 3 "duplicate flag --dry-run" optimize /dev/sdb1 --expect SER1 --dry-run --dry-run
          expect 3 "optimize requires --expect" optimize /dev/sdb1 --dry-run
          expect 3 "device must look like" optimize /dev/nvme0n1 --expect SER1
      - name: Packaging docs and fakes match the helper
        run: |
          set -eux
          # Every op the helper accepts is documented in the security notes.
          for op in add build info pull optimize; do
            grep -qE "^flashcp-helper ${op} +<dev> --expect <key>" packaging/desktop/SECURITY-NOTES.md
          done
          grep -qF '.cache/flashcp/optimize' packaging/desktop/SECURITY-NOTES.md
          # The dev/test fake CLI is a valid, executable shell script that speaks optimize.
          test -x gui/tests/fake-flashcp
          sh -n gui/tests/fake-flashcp
          out="$(gui/tests/fake-flashcp optimize --target-fd 3 --temp /x --yes --dry-run --json)"
          echo "$out" | grep -q '"event":"plan","op":"optimize"'
          echo "$out" | tail -n1 | grep -q '"event":"done"'
      - name: Validate desktop entries
        run: |
          set -eux
          desktop-file-validate packaging/desktop/flashcp-gui.desktop
          desktop-file-validate packaging/desktop/flashcp-gui-autostart.desktop
          # KDE service menus are not full desktop entries and trigger warnings
          # that are not ours to fix, so this one is informational only.
          desktop-file-validate packaging/desktop/flashcp-dolphin.desktop || \
            echo "::warning::flashcp-dolphin.desktop does not pass desktop-file-validate (expected for KDE service menus)"
          desktop-file-validate packaging/desktop/flashcp-dolphin-pull.desktop || \
            echo "::warning::flashcp-dolphin-pull.desktop does not pass desktop-file-validate (expected for KDE service menus)"
      - name: Validate Nautilus extension and polkit policy
        run: |
          set -eux
          python3 -m py_compile packaging/desktop/flashcp_nautilus.py
          python3 -m py_compile packaging/desktop/test_flashcp_nautilus.py
          xmllint --noout packaging/desktop/io.github.zuhuhix.flashcp.helper.policy
          xmllint --noout packaging/desktop/io.github.zuhuhix.flashcp.trust.policy
      - name: Nautilus extension unit tests
        run: python3 -m unittest discover -s packaging/desktop -p 'test_*.py' -v
      - name: Validate Nemo and Dolphin actions
        run: |
          set -eux
          shopt -s nullglob
          for action in packaging/desktop/*.nemo_action; do
            grep -qE '^Name=.+' "$action" || { echo "::error::$action has no Name"; exit 1; }
            grep -qE '^Selection=.+' "$action" || { echo "::error::$action has no Selection"; exit 1; }
            grep -qE '^Exec=.+' "$action" || { echo "::error::$action has no Exec"; exit 1; }
          done
          for action in packaging/desktop/flashcp-pull*.nemo_action; do
            grep -qE '^Exec=flashcp-gui --pull %[FP]$' "$action" || { echo "::error::$action Exec must run flashcp-gui --pull"; exit 1; }
          done
          grep -qE '^Exec=flashcp-gui --pull %f$' packaging/desktop/flashcp-dolphin-pull.desktop
          grep -qE '^X-KDE-RequiredNumberOfUrls=1$' packaging/desktop/flashcp-dolphin-pull.desktop

  deb:
    name: build .deb
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build deb
        working-directory: gui/src-tauri
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles deb
      - name: Check package contents
        run: |
          set -eux
          shopt -s nullglob
          debs=(gui/target/release/bundle/deb/*.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"
          dpkg -I "$deb"
          dpkg -c "$deb" > contents.txt
          cat contents.txt
          for path in \
            ./usr/libexec/flashcp-helper \
            ./usr/libexec/flashcp-trust \
            ./usr/share/polkit-1/actions/io.github.zuhuhix.flashcp.trust.policy \
            ./usr/share/polkit-1/actions/io.github.zuhuhix.flashcp.helper.policy \
            ./etc/xdg/autostart/flashcp-gui.desktop \
            ./usr/share/nemo/actions/flashcp.nemo_action \
            ./usr/share/nemo/actions/flashcp-pull.nemo_action \
            ./usr/share/kio/servicemenus/flashcp.desktop \
            ./usr/share/kio/servicemenus/flashcp-pull.desktop \
            ./usr/share/nautilus-python/extensions/flashcp_nautilus.py \
            ./usr/bin/flashcp-gui; do
            # Tauri's tar lists paths without a leading "./"; accept both spellings.
            awk '{print $NF}' contents.txt | sed 's#^\./##' | grep -qxF "${path#./}" || { echo "::error::missing $path"; exit 1; }
          done
          # The helper runs as root through pkexec, so it must be root-owned and not writable by others.
          for bin in flashcp-helper flashcp-trust; do
            grep -qE "^-rwxr-xr-x (root/root|0/0) .* (\./)?usr/libexec/$bin\$" contents.txt
          done
          # The packaged helper knows optimize and refuses a caller-chosen temp dir.
          mkdir pkg && dpkg-deb -x "$deb" pkg
          set +e
          ok="$(pkg/usr/libexec/flashcp-helper optimize /dev/sdb1 --expect S --dry-run)"; ok_code=$?
          bad="$(pkg/usr/libexec/flashcp-helper optimize /dev/sdb1 --expect S --temp /tmp)"; bad_code=$?
          set -e
          test "$ok_code" -eq 3
          echo "$ok" | grep -q "must be started via pkexec"
          test "$bad_code" -eq 3
          echo "$bad" | grep -q "unexpected argument for optimize"
          # The package must pull in the CLI.
          dpkg-deb -f "$deb" Depends | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -qx 'flashcp'
      - uses: actions/upload-artifact@v4
        with:
          name: flashcp-gui-deb
          path: gui/target/release/bundle/deb/*.deb
