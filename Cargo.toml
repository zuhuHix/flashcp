[package]
name = "flashcp"
version = "0.1.0"
edition = "2024"
description = "Fast file transfers to USB sticks and external drives: builds a whole exFAT volume in one sequential pass"
license = "GPL-3.0-or-later"
repository = "https://github.com/zuhuHix/flashcp"
readme = "README.md"
keywords = ["exfat", "usb", "copy", "filesystem", "flash"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
libc = "0.2.191"
tar = "0.4.46"
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zstd = { version = "0.14.3", features = ["zstdmt"] }

[profile.release]
lto = "thin"
codegen-units = 1

[package.metadata.deb]
maintainer = "zuhu <307932685+zuhuHix@users.noreply.github.com>"
copyright = "zuhu and flashcp contributors"
license-file = ["LICENSE", "0"]
extended-description = """
Fast file transfers to USB sticks and external drives. Builds a whole exFAT
volume from a source directory in one sequential pass. Linux only.
.
Installs /usr/bin/flashcp. The unrelated MTD tool of the same name from
mtd-utils lives in /usr/sbin, which usually comes first in PATH: if both
are installed, run /usr/bin/flashcp (check with `command -v flashcp`).
"""
section = "utils"
priority = "optional"
depends = ""
recommends = "exfatprogs"
assets = [
  ["target/release/flashcp", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/flashcp/README.md", "644"],
]
