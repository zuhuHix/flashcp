[package]
name = "flashcp-helper"
version = "0.1.0"
edition = "2021"
description = "pkexec-launched helpers: run flashcp as the invoking user on one trusted, validated USB drive (passed as an fd), and manage the drive trust list"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "flashcp-helper"
path = "src/main.rs"

[[bin]]
name = "flashcp-trust"
path = "src/bin/flashcp-trust.rs"

[dependencies]
libc = "0.2.191"
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
